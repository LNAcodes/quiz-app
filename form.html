<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>QuizApp</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/quiz-card.css" />
    <link rel="stylesheet" href="./styles/form.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">CyberCheck</h1>
    </header>

    <main class="main-content">
      <section class="form-section">
        <h2>Submit a new question</h2>
        <form class="new-question-form">
          <label for="question">Question</label>
          <textarea id="question" name="question" required></textarea>
          <p class="char-count" aria-live="polite" id="question-count">
            150 characters left
          </p>
          <!-- task fulfilled for bootcamp
          <label for="answer">Answer</label>
          <textarea id="answer" name="answer" required></textarea>
          <p class="char-count" aria-live="polite" id="answer-count">
            150 characters left
          </p>
          -->

          <!-- adjusting submit question answer field to multiple choice: -->
          <fieldset class="answer-options" aria-describedby="options-hint">
            <legend>Answer Options</legend>
            <p id="options-hint" class="visually-hidden">
              Enter three answer options and mark one as the correct answer
              using the radio buttons
            </p>

            <!-- Option 1 -->
            <div class="answer-option">
              <div class="answer-option__header">
                <input
                  type="radio"
                  id="correct-1"
                  name="correct-answer"
                  value="1"
                  required
                />
                <label for="correct-1">Mark as correct answer</label>
              </div>
              <textarea
                name="option-1"
                id="option-1"
                placeholder="Answer option 1"
                maxlength="150"
                required
              ></textarea>
              <p class="char-count" aria-live="polite" id="count-1">
                150 characters left
              </p>
            </div>
            <!-- Option 2 -->
            <div class="answer-option">
              <div class="answer-option__header">
                <input
                  type="radio"
                  id="correct-2"
                  name="correct-answer"
                  value="2"
                />
                <label for="correct-2">Mark as correct answer</label>
              </div>
              <textarea
                name="option-2"
                id="option-2"
                placeholder="Answer option 2"
                maxlength="150"
                required
              ></textarea>
              <p class="char-count" aria-live="polite" id="count-2">
                150 characters left
              </p>
            </div>

            <!-- Option 3 -->
            <div class="answer-option">
              <div class="answer-option__header">
                <input
                  type="radio"
                  id="correct-3"
                  name="correct-answer"
                  value="3"
                />
                <label for="correct-3">Mark as correct answer</label>
              </div>
              <textarea
                name="option-3"
                id="option-3"
                placeholder="Answer option 3"
                maxlength="150"
                required
              ></textarea>
              <p class="char-count" aria-live="polite" id="count-3">
                150 characters left
              </p>
            </div>
          </fieldset>
          <label for="tags">Tag</label>
          <input
            type="text"
            id="tags"
            name="tags"
            placeholder="Fill your tag in"
          />
          <button type="submit">Submit Question</button>
        </form>
      </section>
    </main>
    <footer class="footer">
      <nav class="footer__nav">
        <a class="footer__link" href="./index.html" aria-label="Home">
          <img src="./assets/icons/home.svg" alt="" />
        </a>
        <a class="footer__link" href="./bookmarks.html" aria-label="Bookmarks">
          <img src="./assets/icons/bookmark.svg" alt="" />
        </a>
        <a
          class="footer__link footer__link--active"
          href="./form.html"
          aria-label="Add question"
        >
          <img src="./assets/icons/circle-plus.svg" alt="" />
        </a>
        <a class="footer__link" href="./profile.html" aria-label="Profile">
          <img src="./assets/icons/user.svg" alt="" />
        </a>
      </nav>
    </footer>
    <script src="./scripts/form.js" defer></script>
  </body>
</html>
